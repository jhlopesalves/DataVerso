[project]
name = "dataverso-002-nomes-brasil"
version = "0.1.0"
description = "First-name concentration, generational names, life cycles and spelling in Censo 2022"
requires-python = ">=3.14,<3.15"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "threadpoolctl>=3.8.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=2.4.1",
    "nbconvert>=7.17.2",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "types-requests>=2.33.0.20261030",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ANN"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "RUF001"]

[tool.mypy]
strict = true
files = ["collect.py", "build.py", "house_style.py", "check_outputs.py", "tests", "audit"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "threadpoolctl"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
