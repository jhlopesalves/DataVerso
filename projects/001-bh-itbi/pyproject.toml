[project]
name = "dataverso-001-bh-itbi"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "contextily>=1.6",
    "huggingface-hub>=2.4.0",
    "jinja2>=3.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "ipywidgets>=8.1.9",
    "ipykernel>=6.29",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ANN"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "E501", "I001", "RUF001", "ANN"]
